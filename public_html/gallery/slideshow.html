<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slideshow — Dr Hon Bryn Taurai Mteki</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Space+Mono:wght@400;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --bg-primary: #0A0908;
            --bg-secondary: #12110F;
            --text-primary: #F2EFE9;
            --text-secondary: #A8A29E;
            --accent-ember: #E85D04;
            --transition-slow: 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            --transition-medium: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body {
            font-family: 'Syne', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            overflow: hidden;
            cursor: default;
        }

        .slideshow-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            transition: all var(--transition-slow);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .slide img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 768px) {
            .slide img {
                max-width: 95%;
                max-height: 95%;
            }
            .controls {
                bottom: 1rem;
                gap: 0.5rem;
            }
            .control-btn {
                padding: 0.5rem 0.75rem;
                font-size: 0.6rem;
            }
            .back-btn {
                top: 1rem;
                left: 1rem;
                font-size: 0.5rem;
            }
            .slide-counter {
                top: 1rem;
                right: 1rem;
                font-size: 0.7rem;
            }
        }

        @media (max-width: 480px) {
            .slide img {
                max-width: 100%;
                max-height: 100%;
            }
            .controls {
                flex-direction: column;
                gap: 0.25rem;
            }
        }

        .controls {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
        }

        .control-btn {
            padding: 0.75rem 1rem;
            background: rgba(232, 93, 4, 0.1);
            border: 1px solid rgba(242, 239, 233, 0.1);
            color: var(--text-primary);
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all var(--transition-medium);
        }

        .control-btn:hover {
            background: var(--accent-ember);
            color: var(--bg-primary);
        }

        .back-btn {
            position: absolute;
            top: 2rem;
            left: 2rem;
            padding: 0.5rem 1rem;
            background: rgba(10, 9, 8, 0.8);
            border: 1px solid rgba(242, 239, 233, 0.1);
            color: var(--text-primary);
            text-decoration: none;
            font-family: 'Space Mono', monospace;
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            transition: all var(--transition-medium);
        }

        .back-btn:hover {
            background: var(--accent-ember);
            color: var(--bg-primary);
        }

        .slide-counter {
            position: absolute;
            top: 2rem;
            right: 2rem;
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
    </style>

    <!-- BrynBrands Official Favicons -->
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
    <link rel="manifest" href="../site.webmanifest">

    <!-- Vercel Web Analytics & Speed Insights -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
      window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
    <a href="index.html" class="back-btn">← Back to Gallery</a>
    <div class="slide-counter" id="counter">1 / 24</div>

    <div class="slideshow-container" id="slideshow">
        <div class="slide active">
            <img id="slideImg" src="images/another.png" alt="Artwork">
        </div>
    </div>

    <div class="controls">
        <button class="control-btn" id="prev">Previous</button>
        <button class="control-btn" id="next">Next</button>
    </div>

    <script>
        const images = [
            'another.png',
            'bird.png',
            'boira-mteki-sculptor-from-zimbabwe-VHWU0-570.jpg',
            'cat.png',
            'fifa.png',
            'kids 2.png',
            'kids.png',
            'mapfumo.png',
            'maybe.png',
            'maybee.png',
            'more.png',
            'nigerian.png',
            'paper.png',
            'rock.png',
            'rok.png',
            'Screenshot 2025-12-21 004112.png',
            'simpathy.png',
            'soccer.png',
            'stone.png',
            'stonee.png',
            'stoneee.png',
            'stoneeee.png',
            'stoneeeee.png',
            'stones.png'
        ];

        const slideImg = document.getElementById('slideImg');
        const counter = document.getElementById('counter');
        const prevBtn = document.getElementById('prev');
        const nextBtn = document.getElementById('next');
        let currentIndex = 0;

        function showSlide(index) {
            slideImg.src = `images/${images[index]}`;
            slideImg.alt = `Artwork ${index + 1}`;
            counter.textContent = `${index + 1} / ${images.length}`;
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % images.length;
            showSlide(currentIndex);
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            showSlide(currentIndex);
        }

        nextBtn.addEventListener('click', nextSlide);
        prevBtn.addEventListener('click', prevSlide);

        // Auto-play
        setInterval(nextSlide, 4000);

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        // Initial load
        showSlide(currentIndex);
    </script>
</body>
</html>
